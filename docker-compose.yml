services:
  transcribe:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND_IP:-192.168.5.6}:${PORT:-80}:8000"
    volumes:
      - models:/models
      - jobs:/data
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 160
    mem_limit: ${MEMORY_LIMIT:-6g}
    cpus: ${CPU_LIMIT:-4}
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
volumes:
  models:
  jobs:
